spring:
  application:
    name: boot4-migration-fixture
  datasource:
    url: jdbc:h2:mem:fixture;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  liquibase:
    enabled: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: embedded
  data:
    mongodb:
      database: fixture
      uuid-representation: standard
  session:
    redis:
      namespace: boot35:fixture
  jackson:
    parser:
      allow-unquoted-field-names: true
    serialization:
      write-dates-as-timestamps: false
  dao:
    exceptiontranslation:
      enabled: true
  kafka:
    retry:
      topic:
        backoff:
          random: true
  devtools:
    livereload:
      enabled: true
  mail:
    host: localhost
    port: 2525

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,fixture
  health:
    redis:
      enabled: false
    mongo:
      enabled: false
    rabbit:
      enabled: false
    kafka:
      enabled: false
    mail:
      enabled: false
    jms:
      enabled: false

logging:
  file:
    name: target/fixture.log
  charset:
    file: ISO-8859-1

fixture:
  sample-nullable-value: